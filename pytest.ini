[pytest]
testpaths = tests
# Exclude slow/gated tests from the default run and CI. Run them explicitly with:
#   pytest -m slow
addopts = -m "not slow"
markers =
    smoke: lightweight Streamlit page-load smoke tests (network-blocked, CI-safe)
    slow: slow/gated tests excluded from the default run + CI (e.g. backtest end-to-end)
    network: tests requiring live network (excluded from CI)
    stooq_off: run with the Stooq tier disabled (its default); see data/fetcher._stooq_enabled
filterwarnings =
    ignore::DeprecationWarning
