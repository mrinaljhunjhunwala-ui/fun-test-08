name: Warm Top Picks

# FIX SPEED1. Runs the Top Picks scan on a schedule and persists it to
# trade_store (Postgres) so the deployed app can read it instantly instead
# of paying the ~2-minute cold-scan cost on whichever visit happens to hit
# an expired in-app cache. Requires DATABASE_URL to point at the SAME
# Postgres instance configured in the Streamlit Cloud app's secrets — see
# dashboard/DB_SETUP.md. If DATABASE_URL isn't set, trade_store falls back
# to a local SQLite file that only this ephemeral runner can see, which
# would make this workflow a no-op for the deployed app (it still won't
# fail the job — see scripts/warm_top_picks.py).
#
# NSE hours 09:15–15:30 IST = 03:45–10:00 UTC. GitHub cron is UTC-only and
# can't express :45, so we run 03–10 UTC (matches market-alerts.yml).

on:
  schedule:
    # Task 2.4 F1: extended coverage so the audit-identified off-hours gap
    # (users landing pre-open before 08:30 IST or post-close after 16:30 IST,
    # plus weekend reads of Friday's close) no longer leaks cold ~2-min
    # scans through to whoever hits an expired process-local cache. Free-tier
    # Actions budget stays fine: ~74 runs/week vs the previous 160/week
    # equivalent (see docs/RENDER_SPEED_AUDIT_2026-09.md, F1).
    - cron: "*/15 3-10 * * 1-5"    # market hours, every 15 min (existing)
    - cron: "*/30 1-2 * * 1-5"     # pre-open shoulder 06:30-08:29 IST, every 30 min
    - cron: "*/30 11-13 * * 1-5"   # post-close shoulder 16:30-19:29 IST, every 30 min
    - cron: "0 3 * * 6"            # Saturday 08:30 IST snapshot for weekend reads
  # PRIMARY trigger (2026-09-28): cron-job.org calls the workflow_dispatch API
  # every 15 min, Mon–Fri 09:00–15:45 IST. GitHub drops scheduled runs under
  # load — on 2026-09-28 only 1 of ~17 market-hours ticks fired, so the app's
  # 20-min freshness window lapsed and every visit paid a live scan. The
  # schedule above stays as a backstop; the concurrency group below queues at
  # most one extra run, and the script skips non-trading days on its own.
  #   POST https://api.github.com/repos/mrinaljhunjhunwala-ui/nse-smart-investor/actions/workflows/warm-top-picks.yml/dispatches
  #   Authorization: Bearer <fine-grained PAT, this repo only, Actions: read & write>
  #   Accept: application/vnd.github+json      body: {"ref":"main"}      → 204
  workflow_dispatch:                # allow manual "Run workflow" from the Actions tab

concurrency:
  group: warm-top-picks
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    # 20, not 8 (2026-09-28): the full-universe scan regularly ran past 8 min
    # (runs on 2026-09-25 and 09-27 were cancelled before persisting anything),
    # e.g. when Angel One's breaker trips and every ticker goes to Yahoo.
    # Matches warm_tomorrow_watchlist.yml.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This job (unlike market-alerts.yml) needs the fuller dependency set
      # because it imports dashboard.shared.cache, which pulls in streamlit
      # and plotly at module import time even though this job never renders
      # a UI. Kept as its own requirements file so a future trim of the main
      # requirements.txt doesn't silently break this job.
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run Top Picks warm-up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Angel One credentials deliberately NOT passed (2026-09-28): from GitHub's
          # runners Angel's candle API answers 403 for every ticker, and each
          # rejection costs time before the Yahoo fallback. Since the ANGEL_* secrets
          # were added (2026-09-08 17:55 UTC) every scan here ran past the job
          # timeout; the last scans without them finished in ~31-35 s.
        run: python scripts/warm_top_picks.py
