name: Market Digest

# 2026-09-09 re-registration nudge: the API showed 0 scheduled fires for this
# workflow since it was created, likely because it was modified in 4 rapid
# PRs on 2026-09-08 and GitHub's Actions scheduler paused the cron. Touching
# the file forces a re-registration on the next default-branch push.
#
# Two new alert cadences on top of the existing Market Alerts workflow:
#
#   1. Morning Delivery Digest — 09:00 IST daily (Mon-Fri), pre-market open.
#      Reads the already-persisted top-picks snapshot and emails/Telegrams
#      the top 5 positional candidates for the day. No universe rescan —
#      cheap, sub-30-second run.
#
#   2. Momentum Opportunities Scan — every 30 min, 10:00–15:00 IST.
#      Runs analysis/momentum_scanner over the full niftytotalmarket
#      universe (~745 tickers) and pushes fresh breakouts. Deduped by
#      am/pm bucket in check_alerts.py so you get at most one AM + one
#      PM digest per day, not the same list every 30 min.
#
# Kept separate from market-alerts.yml so a scheduling change to one
# doesn't accidentally alter the other, and so the concurrency groups
# don't collide when the delivery digest and the 15-min market-alerts
# tick happen to overlap at 09:15.

on:
  # No GitHub schedule (removed 2026-10-02): cron-job.org triggers this via
  # workflow_dispatch (alerts/README.md). GitHub's cron fired hours late and
  # only cost Actions minutes.
  workflow_dispatch:
    inputs:
      mode:
        description: "Which digest to fire"
        required: true
        default: "test"
        type: choice
        options:
          - test               # diagnostic — proves both channels deliver
          - test-verdict       # one sample STRONG BUY verdict alert, marked TEST
          - test-digest        # morning digest from the last saved scan, marked TEST
          - morning-digest
          - intraday-watchlist
          - momentum
          - portfolio-posture
          - weekly-digest
      force:
        description: "Bypass market-hours guard + dedup (manual tests). External schedulers send false."
        required: false
        default: true
        type: boolean
      clear_today:
        description: "Wipe today's dedup state before running (fixes 'scheduled runs skipped because a manual test polluted state')"
        required: false
        default: false
        type: boolean

concurrency:
  group: market-digest-${{ github.event.schedule || github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    # Bumped 15 -> 30 on 2026-09-10: the manual dispatch at 2026-09-09 18:31
    # UTC ran 15:45 before hitting the 15-min timeout and being cancelled.
    # Root cause: when Angel One returns 403 for every ticker (session
    # expired / creds stale in CI env), the fetcher cascades through Stooq
    # (also bot-blocked) to yfinance for each of ~745 tickers, and the
    # cascade multiplies the per-ticker wall time by ~3-4x. 30 min covers
    # the slow path with headroom; the fast path (Angel One healthy) still
    # completes in ~3-5 min so this is a no-op in the happy case.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # requirements.txt covers pandas/numpy/yfinance/psycopg2 needed for the
      # trade_store KV read and the fetcher. Install lean but complete.
      - name: Install project deps
        run: pip install --quiet -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Pick mode
        id: pick
        run: |
          # Schedule → mode mapping: 09:00 IST cron → morning-digest,
          # every 30-min cron → momentum. workflow_dispatch → input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * 1-5" ]; then
            echo "mode=morning-digest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 3 * * 1-5" ]; then
            echo "mode=intraday-watchlist" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 8 * * 1-5" ]; then
            echo "mode=portfolio-posture" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * 0" ]; then
            echo "mode=weekly-digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=momentum" >> "$GITHUB_OUTPUT"
          fi

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          # trade_store KV read for the morning digest
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
          # Optional real-time Angel One prices for the momentum scan
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
        # --force on workflow_dispatch so a manual "Run workflow" click for
        # momentum mode works OUTSIDE market hours too (otherwise the
        # market-hours guard silently no-ops evening / weekend runs and it
        # looks like the workflow is broken). Scheduled cron runs never pass
        # --force — they respect the guard as intended.
        run: |
          # Assemble flags. --force on workflow_dispatch bypasses BOTH the
          # market-hours guard AND the dedup check (see check_alerts.py's
          # _FORCE_SEND) so a manual test always sends AND never stamps
          # today's state, which was the root cause of "scheduled runs
          # produce nothing" diagnosed 2026-09-09. --clear-today wipes
          # any lingering dedup entries for today when the input is set.
          FLAGS="--mode=${{ steps.pick.outputs.mode }}"
          # force=false is how the external cron-job.org trigger (alerts/README.md)
          # gets scheduled-run semantics: guard + dedup respected.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "false" ]; then
            FLAGS="$FLAGS --force"
            if [ "${{ github.event.inputs.clear_today }}" = "true" ]; then
              FLAGS="$FLAGS --clear-today"
            fi
          fi
          python alerts/check_alerts.py $FLAGS

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
