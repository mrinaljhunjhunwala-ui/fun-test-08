name: Market Alerts

# 2026-09-09 re-registration nudge: last scheduled fire was 2026-09-08 12:16
# UTC, then the cron went silent. Suspected cause: GitHub's scheduler paused
# the cron after 4 rapid workflow-file modifications on the sibling
# market-digest.yml in the same 24-hour window. Touching this file forces
# re-registration on the next default-branch push.
#
# Runs every 15 minutes during NSE market hours and sends Telegram alerts
# for custom price levels, portfolio holdings (from the My Portfolio page),
# VIX fear/panic regimes, and Nifty downtrends.
#
# NSE hours 09:15–15:30 IST = 03:45–10:00 UTC. GitHub cron is UTC-only and
# can't express :45, so we run 03–10 UTC and the script self-guards on the
# exact IST window (and skips weekends).
#
# 2026-09-28: GitHub's cron was only firing ~2 of ~26 slots/day (often
# after close). The primary trigger is now an EXTERNAL scheduler
# (cron-job.org) calling workflow_dispatch every 15 min — see
# alerts/README.md "Reliable 15-minute cadence". The schedule below is kept
# only as a best-effort fallback; duplicate fires are harmless because the
# concurrency group serialises runs and alert_state.json de-dups per day.

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"   # every 15 min, 03:00–10:59 UTC, Mon–Fri
  workflow_dispatch:               # external 15-min trigger + manual "Run workflow"

# Avoid overlapping runs if one is slow
concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # pyotp: Angel One TOTP login. Without it angel_fetcher fails with
      # "No module named 'pyotp'" and every fetch falls back to Yahoo.
      - name: Install minimal deps
        run: pip install --quiet pandas numpy requests "pyotp>=2.8.0,<3.0" "psycopg2-binary>=2.9.0,<3.0"

      # Persist the de-dup state file between runs so the same alert
      # isn't re-sent every 15 minutes. New cache each run, restore latest.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run alert checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Portfolio alerts read the My Portfolio holdings (and persist their
          # reference prices) in the same Postgres the dashboard uses.
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          # Task 4.1 (added 2026-09-08): Gmail SMTP as the second alert
          # channel alongside Telegram. Requires GitHub Actions secrets:
          #   ALERT_GMAIL_ADDRESS       - your Gmail address
          #   ALERT_GMAIL_APP_PASSWORD  - 16-char app password from
          #                               myaccount.google.com/apppasswords
          #                               (NOT your real Gmail password)
          #   ALERT_GMAIL_TO            - recipient (usually same as address)
          # If any of the three is unset, GmailAlerter falls through to
          # console-fallback and this workflow still succeeds - the Telegram
          # channel picks up the load.
          ALERT_GMAIL_ADDRESS:      ${{ secrets.ALERT_GMAIL_ADDRESS }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_GMAIL_TO:           ${{ secrets.ALERT_GMAIL_TO }}
          # Optional - set these only if you want real-time Angel One prices
          # instead of the 15-min-delayed Yahoo fallback:
          ANGEL_API_KEY:      ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID:    ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD:     ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET:  ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python alerts/check_alerts.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
