name: CI

# Runs the offline test suite on every push / PR to main:
#   * unit + analytics tests (mocked / offline)
#   * 17 Streamlit page smoke tests (network-blocked → deterministic)
#   * valuation golden-snapshot regression (offline replay — fails on posture/confidence/
#     guard drift)
# The slow backtest end-to-end smoke (`-m slow`) and the live valuation diagnostic
# (`tools/validate_valuation.py`) are intentionally NOT run here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pytest

      - name: Run test suite (offline + page smoke + valuation regression; excludes -m slow)
        run: python -m pytest -m "not slow" -q
