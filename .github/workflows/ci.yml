name: CI

# Runs the offline test suite on every PR to main (and on manual dispatch):
#   * unit + analytics tests (mocked / offline)
#   * 17 Streamlit page smoke tests (network-blocked → deterministic)
#   * valuation golden-snapshot regression (offline replay — fails on posture/confidence/
#     guard drift)
# The slow backtest end-to-end smoke (`-m slow`) and the live valuation diagnostic
# (`tools/validate_valuation.py`) are intentionally NOT run here.

# No push-to-main trigger (removed 2026-10-08 to save Actions minutes): every
# change reaches main through a PR whose head CI already tested, so the
# post-merge re-run was a duplicate. Use "Run workflow" to re-test main by hand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the ruff step can diff against the PR base

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Ruff (changed Python files only)
        # Lints only .py files added/modified vs the PR base (or the previous commit on push),
        # so pre-existing violations in untouched files (e.g. dashboard/pages) don't fail CI.
        # Config: pyproject.toml → [tool.ruff].
        run: |
          # Exact pin: a minor bump can add default rules and skew base-vs-head counts.
          pip install --quiet "ruff==0.16.5"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          fi
          BASE=$(git merge-base "$BASE" HEAD)
          # -M: a renamed file is compared against its OLD path at the base.
          CHANGED=$(git diff -M --name-status --diff-filter=ACMR "$BASE" HEAD -- '*.py' || true)
          if [ -z "$CHANGED" ]; then echo "No changed Python files to lint."; exit 0; fi
          # "No NEW violations": compare per-file counts at the base vs HEAD.
          count() { ruff check --output-format concise -q --stdin-filename "$1" - | grep -c . || true; }
          FAIL=0
          while IFS=$'\t' read -r st p1 p2; do
            case "$st" in R*|C*) old="$p1"; f="$p2" ;; *) old="$p1"; f="$p1" ;; esac
            case "$f" in *.py) ;; *) continue ;; esac
            if git cat-file -e "$BASE:$old" 2>/dev/null; then B=$(git show "$BASE:$old" | count "$f"); else B=0; fi
            H=$(count "$f" < "$f")
            echo "$f: base=$B head=$H"
            if [ "$H" -gt "$B" ]; then echo "::error file=$f::ruff violations rose $B -> $H"; ruff check "$f" || true; FAIL=1; fi
          done <<< "$CHANGED"
          exit $FAIL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pytest

      - name: Run test suite (offline + page smoke + valuation regression; excludes -m slow)
        # real_postgres tests skip here (no TEST_DATABASE_URL) — they run in the
        # real-postgres job below.
        run: python -m pytest -m "not slow" -q -rs

  real-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Every run shares the Neon `ci-tests` branch; concurrent runs doing DDL on
    # the same tables deadlocked (run 37014283387). tests/conftest.py now gives
    # each pytest session its own schema (search_path pinned to it, dropped at
    # session end), so runs never touch each other's objects and can overlap.
    # No repo-wide concurrency group here: GitHub keeps only ONE pending run per
    # group and cancels the older pending ones, which kept cancelling this job
    # with zero steps whenever several PRs were open (run 37058538111).
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt
          pip install --quiet pytest

      - name: Run real-Postgres tests
        # TEST_DATABASE_URL points at the throwaway Neon `ci-tests` branch (schema
        # only); tests skip when it's unset (forks) and conftest refuses a URL
        # equal to production.
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: python -m pytest -m "real_postgres and not slow" -q -rs
