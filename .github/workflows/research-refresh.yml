name: Research Refresh (score efficacy + regime study)
# Manually-triggered only — this is an occasional, deliberate re-run of the
# two read-only research scripts, not part of every push/PR.
#
# WHY THIS EXISTS: docs/SCORE_EFFICACY_REPORT.md and docs/REGIME_STUDY_REPORT.md were
# both committed 2026-06-10, but the walk-forward loop in both
# research/score_efficacy.py and research/regime_study.py raised
# AttributeError on cs.pattern_score on EVERY sample (analysis/score.py
# removed that field in the pattern-removal migration) until FIX EFF1 landed
# 2026-07-07 — nearly a month later. Neither report reflects a run of the
# current scoring logic. Local sandboxes (both the maintainer's and Claude's)
# lack outbound access to Yahoo Finance / Stooq / NSE, so a real run has to
# happen here, where that network access already exists (see
# market-alerts.yml, which hits the same providers on a schedule).
#
# Also runs research/score_variants_volume.py — a follow-up variant study
# (same discipline as docs/RESEARCH_SCORE_VARIANTS.md's pattern/oversold-RSI
# tests) checking whether the volume component (15/90 pts) is dead weight,
# after the real score_efficacy/regime_study runs above found it near-zero-
# to-negative in every regime breakdown in both studies.
#
# Also runs research/score_variants_untapped.py — tests five candidate
# indicator-family bonuses (VWAP deviation, Supertrend direction, Bollinger
# %B, Stochastic K/D, and relative strength vs Nifty) that utils/indicators.py
# already computes on every walk-forward frame but analysis/score.py never
# scores, each against the same forward-return/decile framework as the studies
# above, before any of them are considered for production weight changes.
#
# Also runs research/score_variants_rs.py — the confirmatory follow-up to the
# untapped-indicator study above. Re-tests only the RS (relative strength vs
# Nifty) variant that looked promising there, but on calendar-aligned,
# near-non-overlapping sample dates shared across the whole universe, with an
# explicit train/holdout split, cluster-bootstrap confidence intervals, and a
# documented survivorship-bias caveat — see the module docstring for why each
# of those exists. Still makes no production changes.
#
# This job does NOT rewrite the .md reports automatically — it only produces
# the raw CSVs + console output as a downloadable artifact. Turning those
# numbers into report prose/conclusions is a separate, deliberate step.
on:
  workflow_dispatch:
concurrency:
  group: research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -r requirements.txt
      # tee needs research/output/ to exist before either script's own
      # os.makedirs() call runs (that happens after arg-parsing, inside
      # main() — too late for tee's own file-open).
      - name: Create output directory
        run: mkdir -p research/output
      # Full universe (no --limit) for both — docstrings estimate a few
      # minutes and ~4-6 min respectively; timeout-minutes above gives a
      # wide margin for Yahoo/Stooq retries and rate-limit backoff, which
      # this repo's own test logs show can be substantial some days.
      - name: Run score efficacy study
        run: python -m research.score_efficacy 2>&1 | tee research/output/score_efficacy_console.log
      - name: Run regime study
        run: python -m research.regime_study 2>&1 | tee research/output/regime_study_console.log
      - name: Run volume variant study
        run: python -m research.score_variants_volume 2>&1 | tee research/output/score_variants_volume_console.log
      - name: Run untapped-indicator variant study
        run: python -m research.score_variants_untapped 2>&1 | tee research/output/score_variants_untapped_console.log
      - name: Run RS confirmatory study (calendar-aligned, train/holdout)
        run: python -m research.score_variants_rs 2>&1 | tee research/output/score_variants_rs_console.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: research-output-${{ github.run_id }}
          path: research/output/
          retention-days: 30
